name: CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        go: [1.19]
        stage: [testredis, testconn, testcluster]

    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Cache go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache valkey build
      uses: actions/cache@v4
      with:
        path: |
          /tmp/valkey-server
        key: ${{ runner.os }}-valkey-${{ hashFiles('Makefile') }}

    - name: Install valkey
      run: make /tmp/valkey-server/valkey-server

    - name: Build
      run: make ${{ matrix.stage }}
